<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ShipInsure Merchant Vault</title>
<meta property="og:title" content="Your ShipInsure Merchant Vault">
<meta property="og:description" content="Your deck, designs, team and action plan — all in one place.">
<meta property="og:image" content="https://drewshafe.github.io/si-merchant-vault/assets/vault-icon.png">
<link rel="icon" type="image/png" href="assets/vault-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Lexend+Deca:wght@400;500&display=swap">
<link rel="stylesheet" href="vault.css?v=20261006a">
<style>
  html, body { margin: 0; background: #fff; }
  .splash { min-height: 100vh; display: grid; place-items: center; text-align: center; font-family: "Montserrat", system-ui, sans-serif; color: #4a4d66; padding: 24px; }
  .splash img { width: 96px; height: 96px; margin: 0 auto 14px; display: block; }
  .splash img.spin { animation: dial 1.6s cubic-bezier(.5,0,.3,1) infinite; }
  @keyframes dial { 0% { transform: rotate(0); } 60%, 100% { transform: rotate(360deg); } }
  .splash h1 { font-size: 20px; font-weight: 800; margin: 0 0 6px; color: #1b1d2e; }
  .splash p { margin: 0; font-size: 15px; }
  .team-bar { position: sticky; top: 0; z-index: 50; background: #1b1d2e; color: #fff; font: 600 13px/1.3 "Montserrat", system-ui, sans-serif; padding: 8px 16px; text-align: center; }
  .team-bar b { color: #c9cdff; }
  @media (prefers-reduced-motion: reduce) { .splash img.spin { animation: none; } }
</style>
</head>
<body>
<div id="app"><div class="splash"><div><img class="spin" src="assets/vault-icon.png" alt=""><h1>Opening your vault…</h1></div></div></div>
<script src="https://drewshafe.github.io/si-roi-calculator/sb.js"></script>
<script src="vault-core.js?v=20261006a"></script>
<script>
(function () {
  const app = document.getElementById('app');
  const q = new URLSearchParams(location.search);
  const id = q.get('id') || '';
  const key = q.get('k') || '';
  const localId = (/[#&]local=([\w-]+)/.exec(location.hash) || [])[1];
  // Reps (signed in on this origin) and studio previews are never tracked.
  let isTeam = q.get('preview') === '1' || !!localId;
  try { if (localStorage.getItem('sb-oiljklutlmtztascnkpm-auth-token')) isTeam = true; } catch (e) {}

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let visitor = store.get('mv_vid');
  if (!visitor) { visitor = 'v' + Math.random().toString(36).slice(2, 12); store.set('mv_vid', visitor); }
  let who = null; try { who = JSON.parse(store.get('mv_who') || 'null'); } catch (e) {}
  const whoStr = () => who ? (who.name || '') + (who.email ? ' <' + who.email + '>' : '') : null;

  function fail(title, text) {
    app.innerHTML = '<div class="splash"><div><img src="assets/vault-icon.png" alt=""><h1>' + MV.esc(title) + '</h1><p>' + MV.esc(text) + '</p></div></div>';
  }

  const track = (kind, detail) => {
    if (isTeam || !id) return;
    MV.API.track(id, kind, detail, visitor, whoStr()).catch(() => {});
  };

  // Serialize merchant saves; replay each op on the freshest copy so two people
  // checking different steps at once don't overwrite each other.
  let chain = Promise.resolve();
  function save(vault, kind, info, root) {
    if (!id || !key) return;
    chain = chain.then(async () => {
      try {
        if (kind === 'plan' && info.op) {
          const fresh = await MV.API.publicGet(id, key);
          const plan = (fresh && fresh.data && fresh.data.plan) || vault.plan;
          if (plan !== vault.plan) MV.applyPlanOp(plan, info.op);
          await MV.API.merchantSave(id, key, { plan: plan }, info.label);
          if (plan !== vault.plan) { vault.plan = plan; MV.part(root, 'plan'); }
          track('plan', { label: info.label });
        } else if (kind === 'team') {
          await MV.API.merchantSave(id, key, { teamMerchant: vault.team.merchant }, info.label);
          track('team', { label: info.label });
        }
      } catch (e) {
        MV.toast('Couldn’t save that change — check your connection and try again.', 4000);
      }
    });
  }

  async function gate(vault) {
    const mode = (vault.settings && vault.settings.access) || 'link';
    if (mode === 'link' || isTeam) return;
    if (who && who.name && (mode !== 'email' || who.email)) return;
    const fields = [{ key: 'name', label: 'Your name', required: true }];
    fields.push({ key: 'email', label: 'Work email', type: 'email', required: mode === 'email' });
    const r = await MV.form({
      title: 'Welcome to your ShipInsure vault',
      text: 'Tell us who’s here so your ShipInsure team knows who to follow up with. We only use this for this deal.',
      fields: fields, values: who || {}, submit: 'Enter vault', noCancel: true
    });
    who = { name: r.name, email: r.email };
    store.set('mv_who', JSON.stringify(who));
  }

  async function boot() {
    let vault, editable = false;
    if (localId) {
      let all = {}; try { all = JSON.parse(store.get('mv_local_vaults') || '{}'); } catch (e) {}
      if (!all[localId]) return fail('Preview not found', 'This local draft isn’t in this browser.');
      vault = all[localId].data;
    } else {
      if (!id) return fail('Vault not found', 'This link is missing its vault id. Ask your ShipInsure rep for a fresh link.');
      let row = null;
      try { row = await MV.API.publicGet(id, key); }
      catch (e) { return fail('We couldn’t open this vault', 'Please refresh in a moment, or ask your ShipInsure rep for a fresh link.'); }
      if (!row) return fail('This vault isn’t available', 'It may have been archived. Reach out to your ShipInsure rep for a fresh link.');
      vault = row.data; editable = !!row.editable && !isTeam;
    }
    const m = (vault.merchant && vault.merchant.name) || '';
    document.title = 'ShipInsure <> ' + (m || 'Merchant Vault');
    await gate(vault);

    app.innerHTML = (isTeam ? '<div class="team-bar">Team preview — <b>this is what ' + MV.esc(m || 'the merchant') + ' sees</b>. Not tracked; plan checkboxes are live for the merchant only.</div>' : '') + '<div id="vault"></div>';
    const root = document.getElementById('vault');
    MV.render(root, vault, {
      mode: 'live', canPlan: editable, canTeam: editable,
      who: () => who || {},
      setWho: w => { who = w; store.set('mv_who', JSON.stringify(w)); },
      track: track,
      onChange: (kind, info) => save(vault, kind, info, root)
    });

    // Visit + time-on-page (visible time only; flushed on hide and every 2 min)
    let ref = ''; try { ref = document.referrer ? new URL(document.referrer).hostname : ''; } catch (e) {}
    track('visit', { ref: ref, mobile: /Mobi|Android/i.test(navigator.userAgent) });
    let acc = 0, last = Date.now(), visible = !document.hidden;
    const tick = () => { const now = Date.now(); if (visible) acc += (now - last) / 1000; last = now; };
    const flush = (beacon) => {
      tick();
      const secs = Math.round(acc);
      if (secs < 5 || isTeam || !id) return;
      acc = 0;
      if (beacon) MV.API.beacon(id, 'time', { secs: secs }, visitor, whoStr());
      else track('time', { secs: secs });
    };
    document.addEventListener('visibilitychange', () => { if (document.hidden) { flush(true); visible = false; } else { last = Date.now(); visible = true; } });
    window.addEventListener('pagehide', () => flush(true));
    setInterval(() => flush(false), 120000);
  }
  boot();
})();
</script>
</body>
</html>
